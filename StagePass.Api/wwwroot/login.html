<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — StagePass</title>
  <link rel="stylesheet" href="css/site.css">
  <style>
    body { display: flex; min-height: 100vh; }

    /* Left decorative panel */
    .auth-panel-left {
      flex: 1;
      background: linear-gradient(145deg, #0d0d20 0%, #1a0850 50%, #3a0c8c 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      min-height: 100vh;
    }
    .auth-panel-left::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.3) 0%, transparent 70%);
      top: -100px; right: -100px;
    }
    .auth-panel-left::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);
      bottom: -80px; left: -80px;
    }
    .auth-left-content { position: relative; z-index: 1; }
    .auth-left-logo { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.03em; color: #fff; margin-bottom: 64px; display: inline-block; }
    .auth-left-logo span { color: var(--brand-light); }
    .auth-left-headline { font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; color: #fff; margin-bottom: 20px; }
    .auth-left-sub { font-size: 1rem; color: rgba(255,255,255,0.6); max-width: 320px; }
    .auth-left-stats { display: flex; gap: 32px; position: relative; z-index: 1; }
    .auth-stat .num { font-size: 2rem; font-weight: 900; color: #fff; }
    .auth-stat .lab { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 4px; }

    /* Right form panel */
    .auth-panel-right {
      width: 480px;
      flex-shrink: 0;
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      border-left: 1px solid var(--line-dim);
    }
    .auth-form-wrap { width: 100%; max-width: 360px; }
    .auth-form-title { font-size: var(--f-3xl); font-weight: 800; letter-spacing: -0.03em; margin-bottom: var(--sp-2); }
    .auth-form-sub { font-size: var(--f-sm); color: var(--text-mid); margin-bottom: var(--sp-8); }
    .auth-form-sub a { color: var(--brand-light); }
    .auth-divider { display: flex; align-items: center; gap: var(--sp-4); margin: var(--sp-6) 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }
    .auth-divider span { font-size: var(--f-xs); color: var(--text-ghost); white-space: nowrap; }
    .auth-footer { text-align: center; margin-top: var(--sp-6); font-size: var(--f-sm); color: var(--text-mid); }
    .auth-footer a { color: var(--brand-light); font-weight: 600; }
    #login-error { display: none; }
    #login-error:not(:empty) { display: block; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .auth-panel-left { display: none; }
      .auth-panel-right { width: 100%; border-left: none; padding: var(--sp-8) var(--sp-6); min-height: 100vh; align-items: flex-start; padding-top: 80px; }
    }
  </style>
</head>
<body>

  <!-- Left: decorative -->
  <div class="auth-panel-left">
    <div class="auth-left-content">
      <a href="index.html" class="auth-left-logo">Stage<span>Pass</span></a>
      <h1 class="auth-left-headline">Your front-row seat starts here.</h1>
      <p class="auth-left-sub">Discover and book tickets to the best live performances in your city.</p>
    </div>
    <div class="auth-left-stats">
      <div class="auth-stat"><div class="num">200+</div><div class="lab">Live events</div></div>
      <div class="auth-stat"><div class="num">5min</div><div class="lab">Hold your tickets</div></div>
      <div class="auth-stat"><div class="num">0</div><div class="lab">Booking fees</div></div>
    </div>
  </div>

  <!-- Right: form -->
  <div class="auth-panel-right">
    <div class="auth-form-wrap">
      <h1 class="auth-form-title">Welcome back</h1>
      <p class="auth-form-sub">Don't have an account? <a href="register.html">Sign up free</a></p>

      <div id="login-error" class="alert alert-bad" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-btn" class="btn btn-brand btn-full btn-lg" style="margin-top:8px;">
          Sign in
        </button>
      </form>

      <div class="auth-footer">
        New to StagePass? <a href="register.html">Create account</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // Redirect if already logged in
    if (window.Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !email.includes('@')) {
        errorEl.textContent = 'Please enter a valid email address.';
        return;
      }
      if (!password) {
        errorEl.textContent = 'Please enter your password.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const data = await window.apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        window.Auth.setSession(data);
        // Redirect: go back to previous page or index
        const returnTo = new URLSearchParams(location.search).get('returnTo') || 'index.html';
        window.location.href = returnTo;
      } catch (err) {
        if (err.status === 401) {
          errorEl.textContent = 'Incorrect email or password. Please try again.';
        } else {
          errorEl.textContent = err.message || 'Something went wrong. Please try again.';
        }
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
